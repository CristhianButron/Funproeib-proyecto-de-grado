# Perfil usado solo por las pruebas de integración (@ActiveProfiles("integration")).
# Apunta a una base de datos separada de la de desarrollo (funproeib_db) para
# no pisar datos reales.
#
# ddl-auto=update (no create-drop): cada clase de prueba de integración abre
# su propio contexto de Spring (distinto al de otras clases, por los beans
# que cada una mockea/espía), y varios contextos pueden convivir durante una
# misma ejecución de "mvn test". Con create-drop, el segundo contexto en
# arrancar borra y recrea las tablas mientras el primero todavía las usa,
# lo que corrompe sus entidades ya cargadas (StaleObjectStateException). Con
# update, cada clase simplemente verifica que el esquema ya existe y sigue;
# el aislamiento entre pruebas lo da @Transactional (cada test hace rollback
# al terminar), igual que en los tests unitarios de servicio.
#
# Antes de correr las pruebas de integración hay que crear la base una vez:
#   psql -U postgres -h localhost -c "CREATE DATABASE funproeib_test_db;"

spring.datasource.url=jdbc:postgresql://localhost:5432/funproeib_test_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.mail.enabled=false
