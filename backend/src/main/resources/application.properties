spring.application.name=funproeib-backend

# Activa automáticamente application-local.properties si existe (no se sube a
# git). Ahí cada desarrollador pone su configuración local real -por ejemplo,
# credenciales SMTP para probar el envío de correos- sin tener que exportar
# variables de entorno cada vez que corre el backend.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:postgresql://localhost:5432/funproeib_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Render (y la mayoría de hosts) asignan el puerto ellos mismos vía la
# variable de entorno PORT; en desarrollo local, al no existir esa
# variable, usa 8080 como siempre.
server.port=${PORT:8080}

logging.level.org.springframework=INFO
logging.level.bo.edu.ucb.funproeib=DEBUG

# Carga de documentos: carpeta donde se guardan los archivos subidos por los
# postulantes (relativa al directorio de trabajo del backend, o una ruta
# absoluta si se monta un volumen persistente en producción/Docker).
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Verificación de correo al registrarse. Mientras app.mail.enabled=false (o
# no haya API key de Resend), el correo de verificación se escribe en el log
# del backend en lugar de enviarse, para poder seguir el flujo en desarrollo.
# Se manda por la API HTTP de Resend (resend.com), no por SMTP: varios hosts
# gratuitos (Render incluido) bloquean las conexiones salientes por los
# puertos SMTP para evitar spam, así que un correo por SMTP nunca llegaría a
# conectar; la API HTTP va por el puerto 443 como cualquier petición web.
# En producción: crear una cuenta en resend.com, generar una API key y
# definir RESEND_API_KEY (variable de entorno) y APP_MAIL_ENABLED=true.
# El remitente (APP_MAIL_REMITENTE) debe ser de un dominio verificado en
# Resend, o se puede usar "onboarding@resend.dev" mientras no se tenga uno
# propio (con la limitación de que Resend solo deja mandar a la casilla con
# la que se creó la cuenta hasta que se verifique un dominio real).
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.remitente=${APP_MAIL_REMITENTE:no-responder@funproeib.org}
# URL pública del frontend, usada para armar el enlace de verificación.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Teléfono que se muestra al postulante cuando no puede postularse (sin
# cupos o programa ya iniciado/cerrado), para que contacte al equipo de
# forma directa. IMPORTANTE: reemplazar por el número real antes de usar
# esto en producción.
app.contacto.telefono=${APP_CONTACTO_TELEFONO:+591 4 000-0000}

# Clave con la que se firman los JWT de sesión. La de acá es solo para
# desarrollo local -no es secreta, está en el repositorio-; en producción
# hay que definir la variable de entorno APP_JWT_SECRET con una clave propia
# de al menos 32 caracteres al azar (por ejemplo: openssl rand -base64 48).
app.jwt.secret=${APP_JWT_SECRET:dev-only-secreto-no-usar-en-produccion-cambiar-32+chars}
# Duración de la sesión en minutos antes de que haya que volver a iniciar sesión.
app.jwt.expiracion-minutos=${APP_JWT_EXPIRACION_MINUTOS:480}

# Orígenes desde los que el navegador puede llamar a la API (separados por
# coma). Los dos de acá son solo para desarrollo local (4200 es el puerto
# normal de "ng serve"; 4300 es el alterno si Windows bloquea el 4200). EN
# PRODUCCIÓN hay que definir APP_CORS_ORIGENES con el dominio real del
# frontend desplegado (por ejemplo "https://funproeib.org"), porque
# "localhost" nunca va a coincidir con el origen real del navegador y todo
# fallará con error de CORS.
app.cors.origenes=${APP_CORS_ORIGENES:http://localhost:4200,http://localhost:4300}