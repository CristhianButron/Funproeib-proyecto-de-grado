spring.application.name=funproeib-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/funproeib_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

logging.level.org.springframework=INFO
logging.level.bo.edu.ucb.funproeib=DEBUG

# Carga de documentos: carpeta donde se guardan los archivos subidos por los
# postulantes (relativa al directorio de trabajo del backend, o una ruta
# absoluta si se monta un volumen persistente en producción/Docker).
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB